<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/app.js"></script>
    <link rel="stylesheet" href="style.css">

<body>

    </header>
    <main>
        <div class="container my-5">
            <form action="" id="user-form">
                <div class="datiUtente">
                    <div class="nomeCognome">
                        <label for="nomeCognome" class="form-label">Nome e Cognome</label>
                        <input type="text" class="form-control" id="nomeCognome">
                    </div>
                    <div class="chilometri">
                        <label for="chilometri" class="form-label">Chilometri</label>
                        <input type="number" class="form-control" id="chilometri">
                    </div>
                    <div class="eta">
                        <label for="eta" class="form-label">Età</label>
                        <input type="number" class="form-control" id="eta">
                    </div>
                </div>
                <div class="containerbtn">
                    <button type="submit" class="btn btn-primary">Genera</button>
                    <button type="reset" class="btn btn-secondary">Annulla</button>
                </div>


            </form>

            <div class="containerout">
                <div class="outputNome"></div>

                <div class="outputkm"></div>






            </div>







        </div>
    </main>
    <footer>

    </footer>
